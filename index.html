<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灰狼隊 PlayType & Tracking 每日追蹤</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts Dependencies & CDN -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.15.3/umd/Recharts.js"></script>

    <script>
        window.isCloudEnabled = false;
        window.db = null;
        window.firebaseModules = null;
        window.firebaseError = null;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3b09cIAwNnxBMLinKMP3sOP5ORR4xwo8",
            authDomain: "wolves-traker.firebaseapp.com",
            projectId: "wolves-traker",
            storageBucket: "wolves-traker.firebasestorage.app",
            messagingSenderId: "711518203108",
            appId: "1:711518203108:web:26c7f17065cfec5eaed0f1"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            window.db = getFirestore(app);
            window.firebaseModules = { collection, doc, getDoc, onSnapshot, query, orderBy };

            signInAnonymously(auth).then(() => {
                console.log("✅ Firebase 連線成功 (匿名登入 - 純讀取)");
                window.isCloudEnabled = true;
                window.firebaseError = null;
                window.dispatchEvent(new Event('firebase-ready'));
            }).catch(e => {
                console.warn("Firebase 登入失敗:", e);
                window.firebaseError = e;
                window.dispatchEvent(new Event('firebase-error'));
                const errLog = document.getElementById('error-log');
                if (errLog) {
                    errLog.style.display = 'block';
                    errLog.innerText = "連線失敗: " + e.code + "\n(請點擊左上角 No Conn 查看詳情)";
                }
            });
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
            window.firebaseError = e;
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: white;
            font-family: sans-serif;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1e293b;
            border-top-color: #78BE20;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .chart-dot:hover {
            r: 6;
            stroke-width: 3;
            cursor: pointer;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #94a3b8; font-size: 0.9rem;">正在連線至雲端資料庫...</p>
        <p id="error-log"
            style="margin-top: 10px; color: #ef4444; font-size: 0.8rem; white-space: pre-wrap; text-align: center; display: none;">
        </p>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        window.onerror = function (message, source, lineno, colno, error) {
            const el = document.getElementById('error-log');
            if (el) { el.style.display = 'block'; el.innerText = "系統偵測到錯誤:\n" + message; }
        };
    </script>

    <!--
        所有元件已合併成 dist/components-bundle.js（由 scripts/bundle.py 產生）。
        編輯 components/*.js 後請執行：python scripts/bundle.py
    -->
    <script type="text/babel" src="dist/components-bundle.js"></script>
</body>

</html>
