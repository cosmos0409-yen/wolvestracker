<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Wolves Ledger｜灰狼數據帳本">

    <meta name="twitter:card" content="summary">
    <!-- 網站圖示：深藍底 + 綠色 W（內嵌 SVG，免額外檔案） -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230A1626'/%3E%3Cpath d='M12 18h8l5 22 7-22h4l7 22 5-22h8l-9 30h-7l-6-19-6 19h-7z' fill='%2312A150'/%3E%3C/svg%3E">

    <!-- 字體：Barlow Condensed（數字/標題）、Noto Sans TC（中文）、JetBrains Mono（標籤/原文）；display=swap 避免字體載入前空白 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">

    <!-- 版本一律鎖定：未鎖版的 CDN 網址會在上游發新版時悄悄改變網站行為 -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Recharts Dependencies & CDN -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.15.3/umd/Recharts.js"></script>

    <script>
        window.isCloudEnabled = false;
        window.db = null;
        window.firebaseModules = null;
        window.firebaseError = null;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeFirestore, collection, doc, getDoc, getDocs, onSnapshot, query, orderBy, where, documentId } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3b09cIAwNnxBMLinKMP3sOP5ORR4xwo8",
            authDomain: "wolves-traker.firebaseapp.com",
            projectId: "wolves-traker",
            storageBucket: "wolves-traker.firebasestorage.app",
            messagingSenderId: "711518203108",
            appId: "1:711518203108:web:26c7f17065cfec5eaed0f1"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            // autoDetectLongPolling：WebChannel 被擋的環境（部分 localhost/網路）自動退回長輪詢，避免讀取卡死
            window.db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
            window.firebaseModules = { collection, doc, getDoc, getDocs, onSnapshot, query, orderBy, where, documentId };

            signInAnonymously(auth).then(() => {
                console.log("✅ Firebase 連線成功 (匿名登入 - 純讀取)");
                window.isCloudEnabled = true;
                window.firebaseError = null;
                window.dispatchEvent(new Event('firebase-ready'));
            }).catch(e => {
                console.warn("Firebase 登入失敗:", e);
                window.firebaseError = e;
                window.dispatchEvent(new Event('firebase-error'));
                const errLog = document.getElementById('error-log');
                if (errLog) {
                    errLog.style.display = 'block';
                    errLog.innerText = "連線失敗: " + e.code + "\n(請點擊左上角 No Conn 查看詳情)";
                }
            });
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
            window.firebaseError = e;
        }
    </script>

    <style>
        body {
            background-color: #0A1626;
            color: white;
            font-family: "Noto Sans TC", system-ui, sans-serif;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #0A1626;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1e293b;
            border-top-color: #12A150;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .chart-dot:hover {
            r: 6;
            stroke-width: 3;
            cursor: pointer;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
    <!-- Tailwind 預編譯產物（python scripts/bundle.py 產生；?v= 為內容雜湊，勿手改） -->
    <link rel="stylesheet" href="dist/app.css?v=2f8d9e64">
</head>

<body>
    <div id="loading-screen">
        <div style="font-family: 'Barlow Condensed', 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; color: #F8FAFC; margin-bottom: 18px;">Wolves <span style="color: #12A150;">Ledger</span></div>
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #94a3b8; font-size: 0.9rem;">正在連線至雲端資料庫…</p>
        <p id="error-log"
            style="margin-top: 10px; color: #ef4444; font-size: 0.8rem; white-space: pre-wrap; text-align: center; display: none;">
        </p>
    </div>

    <div id="root"></div>

    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            const el = document.getElementById('error-log');
            if (el) { el.style.display = 'block'; el.innerText = "系統偵測到錯誤:\n" + message; }
        };
    </script>

    <!--
        所有元件已合併並預先編譯成 dist/components-bundle.js（由 scripts/bundle.py 產生）。
        編輯 components/*.js 後請執行：python scripts/bundle.py
        defer：與上方 type="module" 的 Firebase 初始化同屬「解析完才依序執行」佇列，
        保證元件在 Firebase 初始化之後才執行（維持舊版 Babel 時代的執行順序）
    -->
    <script defer src="dist/components-bundle.js?v=985b49be"></script>
</body>

</html>
