<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灰狼隊 PlayType & Tracking 每日追蹤</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts Dependencies & CDN -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.15.3/umd/Recharts.js"></script>

    <script>
        window.isCloudEnabled = false;
        window.db = null;
        window.firebaseModules = null;
        window.firebaseError = null;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // =================================================================
        //  設定區：wolves-traker (純讀取，寫入均由 GitHub Actions 處理)
        // =================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyA3b09cIAwNnxBMLinKMP3sOP5ORR4xwo8",
            authDomain: "wolves-traker.firebaseapp.com",
            projectId: "wolves-traker",
            storageBucket: "wolves-traker.firebasestorage.app",
            messagingSenderId: "711518203108",
            appId: "1:711518203108:web:26c7f17065cfec5eaed0f1"
        };
        // =================================================================

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            window.db = getFirestore(app);

            // 唯讀需要的模組
            window.firebaseModules = { collection, doc, onSnapshot, query, orderBy };

            signInAnonymously(auth).then(() => {
                console.log("✅ Firebase 連線成功 (匿名登入 - 純讀取)");
                window.isCloudEnabled = true;
                window.firebaseError = null;
                window.dispatchEvent(new Event('firebase-ready'));
            }).catch(e => {
                console.warn("Firebase 登入失敗:", e);
                window.firebaseError = e;
                window.dispatchEvent(new Event('firebase-error'));
                const errLog = document.getElementById('error-log');
                if (errLog) {
                    errLog.style.display = 'block';
                    errLog.innerText = "連線失敗: " + e.code + "\n(請點擊左上角 No Conn 查看詳情)";
                }
            });
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
            window.firebaseError = e;
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: white;
            font-family: sans-serif;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1e293b;
            border-top-color: #78BE20;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .chart-dot:hover {
            r: 6;
            stroke-width: 3;
            cursor: pointer;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #94a3b8; font-size: 0.9rem;">正在連線至雲端資料庫...</p>
        <p id="error-log"
            style="margin-top: 10px; color: #ef4444; font-size: 0.8rem; white-space: pre-wrap; text-align: center; display: none;">
        </p>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        window.onerror = function (message, source, lineno, colno, error) {
            const el = document.getElementById('error-log');
            if (el) { el.style.display = 'block'; el.innerText = "系統偵測到錯誤:\n" + message; }
        };

        const { useState, useEffect, useMemo } = React;
        const { Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, ResponsiveContainer, Tooltip } = window.Recharts || {};

        // Icons
        const Icons = {
            ArrowUp: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></svg>,
            ArrowDown: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></svg>,
            Minus: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14" /></svg>,
            Database: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></svg>,
            ExternalLink: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" x2="21" y1="14" y2="3" /></svg>,
            ChevronLeft: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6" /></svg>,
            ChevronRight: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6" /></svg>,
            Calendar: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></svg>,
            X: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>,
            Users: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>,
            User: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>,
            Shield: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /><path d="m9 12 2 2 4-4" /></svg>,
            Sword: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" /><line x1="13" x2="19" y1="19" y2="13" /><line x1="16" x2="20" y1="16" y2="20" /><line x1="19" x2="21" y1="21" y2="19" /></svg>,
            BarChart: ({ className }) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" x2="18" y1="20" y2="10" /><line x1="12" x2="12" y1="20" y2="4" /><line x1="6" x2="6" y1="20" y2="14" /></svg>
        };

        const PlayTypesList = ["Transition", "Isolation", "PRBallHandler", "PRRollMan", "Postup", "Spotup", "Handoff", "Cut", "OffScreen", "OffRebound", "Misc"];
        // 核心球員排序參考 (如果數據中有這些人則排前面，其餘字母排序)
        const STARTER_SORT_WEIGHT = ["Anthony Edwards", "Julius Randle", "Rudy Gobert", "Jaden McDaniels", "Mike Conley", "Naz Reid", "Donte DiVincenzo"];

        // Components
        const TrendValue = ({ value, prevValue, unit = "", label, reverseColor = false }) => {
            const diff = prevValue ? (value - prevValue).toFixed(1) : 0;
            const numDiff = parseFloat(diff);
            let colorClass = "text-white"; let Icon = null;
            if (prevValue) {
                if (numDiff > 0) { colorClass = reverseColor ? "text-red-400" : "text-green-400"; Icon = Icons.ArrowUp; }
                else if (numDiff < 0) { colorClass = reverseColor ? "text-green-400" : "text-red-400"; Icon = Icons.ArrowDown; }
                else { colorClass = "text-slate-400"; Icon = Icons.Minus; }
            }
            return (<div><span className="block text-slate-500">{label}</span><div className="flex items-center gap-1"><span className={`font-mono text-sm font-bold ${colorClass}`}>{value}{unit}</span>{Icon && <Icon className={`w-3 h-3 ${colorClass}`} />}</div></div>);
        };

        const SimpleLineChart = ({ data, dataKey, color = "#78BE20" }) => {
            if (!data || data.length < 2) return <div className="h-40 flex items-center justify-center text-slate-500 text-xs">數據不足，無法繪製趨勢圖</div>;
            const height = 150; const width = 500; const padding = 20; const paddingLeft = 40;
            const values = data.map(d => parseFloat(d.stat[dataKey] || d.tracking[dataKey]));
            const min = Math.min(...values); const max = Math.max(...values);
            const range = max - min || 1; const buffer = range * 0.1;
            const domainMin = min - buffer; const domainMax = max + buffer; const domainRange = domainMax - domainMin;
            const points = values.map((val, index) => { const x = paddingLeft + (index / (values.length - 1)) * (width - paddingLeft - padding); const y = height - padding - ((val - domainMin) / domainRange) * (height - 2 * padding); return `${x},${y}`; }).join(' ');
            const ticks = []; const numTicks = 5; for (let i = 0; i < numTicks; i++) { const val = domainMin + (domainRange * i) / (numTicks - 1); const y = height - padding - (i / (numTicks - 1)) * (height - 2 * padding); ticks.push({ val, y }); }
            return (<div className="w-full overflow-hidden mb-4 bg-slate-900/50 rounded-lg p-2 border border-slate-800"><svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full">{ticks.map((tick, i) => (<g key={i}><line x1={paddingLeft} y1={tick.y} x2={width - padding} y2={tick.y} stroke="#334155" strokeWidth="1" strokeDasharray="4" opacity="0.5" /><text x={paddingLeft - 5} y={tick.y + 3} textAnchor="end" fill="#64748b" fontSize="10" fontFamily="monospace">{tick.val?.toFixed(2) || 0}</text></g>))}<polyline fill="none" stroke={color} strokeWidth="3" points={points} />{values.map((val, index) => { const x = paddingLeft + (index / (values.length - 1)) * (width - paddingLeft - padding); const y = height - padding - ((val - domainMin) / domainRange) * (height - 2 * padding); return (<g key={index} className="group"><circle cx={x} cy={y} r="4" fill="#0f172a" stroke={color} strokeWidth="2" className="chart-dot transition-all duration-200" /><rect x={x - 15} y={y - 25} width="30" height="16" rx="4" fill="#000" className="opacity-0 group-hover:opacity-100 transition-opacity" /><text x={x} y={y - 13} textAnchor="middle" fill="white" fontSize="10" className="opacity-0 group-hover:opacity-100 transition-opacity font-mono font-bold pointer-events-none">{val}</text><text x={x} y={height - 5} textAnchor="middle" fill="#64748b" fontSize="9">{data[index].date.slice(5).replace('-', '/')}</text></g>); })}</svg></div>);
        };

        // --- Tracker Cards ---
        const PlayTypeCard = ({ type, current, prev, onClick, side }) => {
            if (!current) return null;
            const diffPPP = prev ? (current.ppp - prev.ppp).toFixed(2) : 0;
            const isDefensive = side === 'defensive';
            let isBetter = false; let isWorse = false;
            if (prev) {
                const numDiff = parseFloat(diffPPP);
                if (isDefensive) { if (numDiff < 0) isBetter = true; else if (numDiff > 0) isWorse = true; }
                else { if (numDiff > 0) isBetter = true; else if (numDiff < 0) isWorse = true; }
            }
            let bgColor = "bg-slate-800", borderColor = "border-slate-700";
            if (prev) {
                if (isBetter) { borderColor = "border-green-500/50"; bgColor = "bg-gradient-to-br from-slate-800 to-green-900/30"; }
                else if (isWorse) { borderColor = "border-red-500/50"; bgColor = "bg-gradient-to-br from-slate-800 to-red-900/30"; }
            }
            return (
                <div onClick={() => onClick({ type: 'playtype', id: type })} className={`p-4 rounded-xl border ${borderColor} ${bgColor} shadow-lg relative overflow-hidden cursor-pointer hover:scale-[1.02] transition-transform group`}>
                    <div className="absolute top-0 right-0 p-4 opacity-5 text-slate-400 font-black text-4xl pointer-events-none select-none">{type.substring(0, 2)}</div>
                    <div className="flex justify-between items-start mb-2 relative z-10">
                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider truncate" title={type}>{type}</h3>
                        <div className="text-slate-500 text-[10px] opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">詳情 <Icons.ExternalLink className="w-3 h-3" /></div>
                    </div>
                    <div className="flex items-baseline gap-2 mb-4 relative z-10">
                        <span className={`text-3xl font-extrabold ${isBetter ? 'text-green-400' : isWorse ? 'text-red-400' : 'text-white'}`}>{current.ppp}</span>
                        <span className="text-xs text-slate-500 font-medium">PPP</span>
                        {prev && (<div className={`flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold ml-auto ${isBetter ? 'bg-green-500/20 text-green-400' : isWorse ? 'bg-red-500/20 text-red-400' : 'bg-slate-700 text-slate-400'}`}>{isBetter ? <Icons.ArrowUp className="w-3 h-3 mr-1" /> : isWorse ? <Icons.ArrowDown className="w-3 h-3 mr-1" /> : <Icons.Minus className="w-3 h-3 mr-1" />} {Math.abs(diffPPP)}</div>)}
                    </div>
                    <div className="grid grid-cols-2 gap-y-3 gap-x-2 text-[10px] border-t border-slate-700/50 pt-3 relative z-10 bg-slate-900/30 rounded p-2">
                        <TrendValue label="Percentile" value={current.percentile} prevValue={prev?.percentile} unit="th" />
                        <TrendValue label="FG%" value={current.fgPct} prevValue={prev?.fgPct} unit="%" reverseColor={isDefensive} />
                    </div>
                </div>
            );
        };

        const SimpleMetricCard = ({ title, value, prevValue, unit = "", betterIsLarger = true, icon = null }) => {
            const diff = prevValue != null ? (value - prevValue).toFixed(1) : 0;
            const numDiff = parseFloat(diff);
            let isBetter = false, isWorse = false;
            if (numDiff > 0) { isBetter = betterIsLarger; isWorse = !betterIsLarger; }
            else if (numDiff < 0) { isWorse = betterIsLarger; isBetter = !betterIsLarger; }

            return (
                <div className="p-3 bg-slate-800 rounded border border-slate-700 relative">
                    <p className="text-[#a0aec0] text-xs font-medium mb-1 truncate">{title}</p>
                    <div className="flex items-end gap-2">
                        <span className="text-xl font-bold text-white">{value}{unit}</span>
                        {prevValue != null && numDiff !== 0 && (
                            <span className={`text-[10px] font-bold flex items-center pb-1 ${isBetter ? 'text-green-400' : isWorse ? 'text-red-400' : 'text-slate-500'}`}>
                                {numDiff > 0 ? <Icons.ArrowUp className="w-2.5 h-2.5" /> : <Icons.ArrowDown className="w-2.5 h-2.5" />}
                                {Math.abs(numDiff)}{unit}
                            </span>
                        )}
                    </div>
                </div>
            );
        };

        const TrackingCardRow = ({ title, category, metrics, current, prev, onClick }) => {
            if (!current) return null;
            return (
                <div onClick={() => onClick({ type: 'tracking', id: category })} className="bg-[#1a202c] border border-slate-800 rounded-xl overflow-hidden cursor-pointer hover:border-slate-600 transition-colors group mb-4">
                    <div className="bg-slate-900/80 px-4 py-2 border-b border-slate-800 flex justify-between items-center text-sm font-bold text-[#cbd5e0]">
                        {title}
                        <Icons.ExternalLink className="w-3 h-3 text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity" />
                    </div>
                    <div className="p-4 grid grid-cols-2 md:grid-cols-4 gap-3">
                        {metrics.map((m, i) => (
                            <SimpleMetricCard
                                key={i} title={m.label}
                                value={current[m.key]} prevValue={prev?.[m.key]}
                                unit={m.unit} betterIsLarger={m.betterIsLarger !== false}
                            />
                        ))}
                    </div>
                </div>
            );
        };


        // --- Main App ---
        const App = () => {
            const [teamHistory, setTeamHistory] = useState([]);
            const [playerHistory, setPlayerHistory] = useState([]);
            const [viewMode, setViewMode] = useState('TEAM');
            const [viewSide, setViewSide] = useState('offensive');
            const [selectedPlayer, setSelectedPlayer] = useState("");
            const [viewIndex, setViewIndex] = useState(0);

            // selectedCard: { type: 'playtype'|'tracking', id: string }
            const [selectedCard, setSelectedCard] = useState(null);

            const [isCloud, setIsCloud] = useState(window.isCloudEnabled);

            // Fetch Firebase Logic (Read Only)
            useEffect(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.remove(), 500);
                }

                const handleCloudReady = () => setIsCloud(true);
                window.addEventListener('firebase-ready', handleCloudReady);
                if (window.isCloudEnabled) setIsCloud(true);

                if (window.db && window.firebaseModules) {
                    const { collection, onSnapshot } = window.firebaseModules;
                    onSnapshot(collection(window.db, "wolves_team_stats"), (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ ...doc.data(), date: doc.id }));
                        data.sort((a, b) => new Date(b.date) - new Date(a.date));
                        setTeamHistory(data);
                    });
                    onSnapshot(collection(window.db, "wolves_player_stats"), (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ ...doc.data(), date: doc.id }));
                        data.sort((a, b) => new Date(b.date) - new Date(a.date));
                        setPlayerHistory(data);
                    });
                }
            }, []);

            const handleStatusClick = () => {
                if (isCloud) alert("🔵 連線正常：已成功連線至 Firestore 資料庫，並進入純讀取模式。");
                else alert("🔴 連線失敗：尚未收到 Firebase 回應。");
            };

            // Derive Stats
            let currentStats = []; let currentTracking = {};
            let prevStats = []; let prevTracking = {};
            let displayDate = "尚無數據"; let currentPlayerId = null;

            if (viewMode === 'TEAM') {
                const current = teamHistory[viewIndex]; const prev = teamHistory[viewIndex + 1];
                if (current) { currentStats = current.stats || []; currentTracking = current.tracking || {}; displayDate = current.date; }
                if (prev) { prevStats = prev.stats || []; prevTracking = prev.tracking || {}; }
            } else {
                const current = playerHistory[viewIndex]; const prev = playerHistory[viewIndex + 1];
                if (current && current.stats?.[selectedPlayer]) {
                    currentStats = current.stats[selectedPlayer]; currentTracking = current.tracking?.[selectedPlayer] || {}; displayDate = current.date;
                    if (currentStats.length > 0 && currentStats[0].playerId) currentPlayerId = currentStats[0].playerId;
                    else if (currentTracking.playerId) currentPlayerId = currentTracking.playerId;
                }
                if (prev) {
                    prevStats = prev.stats?.[selectedPlayer] || [];
                    prevTracking = prev.tracking?.[selectedPlayer] || {};
                }
            }

            // 動態取得當前數據中有的球員清單
            const availablePlayers = useMemo(() => {
                const currentData = playerHistory[viewIndex];
                if (!currentData || !currentData.stats) return [];
                const names = Object.keys(currentData.stats);
                return names.sort((a, b) => {
                    const weightA = STARTER_SORT_WEIGHT.indexOf(a);
                    const weightB = STARTER_SORT_WEIGHT.indexOf(b);
                    if (weightA !== -1 && weightB !== -1) return weightA - weightB;
                    if (weightA !== -1) return -1;
                    if (weightB !== -1) return 1;
                    return a.localeCompare(b);
                });
            }, [playerHistory, viewIndex]);

            // 自動修正 selectedPlayer
            useEffect(() => {
                if (viewMode === 'PLAYER' && availablePlayers.length > 0) {
                    if (!selectedPlayer || !availablePlayers.includes(selectedPlayer)) {
                        setSelectedPlayer(availablePlayers[0]);
                    }
                }
            }, [viewMode, availablePlayers]);
            const maxIndex = (viewMode === 'TEAM' ? teamHistory.length : playerHistory.length) - 1;
            const goPrev = () => { if (viewIndex < maxIndex) setViewIndex(viewIndex + 1); };
            const goNext = () => { if (viewIndex > 0) setViewIndex(viewIndex - 1); };

            // Radar Chart Data Logic
            const generateRadarData = () => {
                let data = [];
                if (viewSide === 'offensive') {
                    // Try to map relative PPP / Percentile into 0-100 range based on Tracking & Synergy
                    const isoPlay = currentStats.find(s => s.playType === 'Isolation' && s.side === 'offensive');
                    const catchShootEfg = currentTracking.CATCH_SHOOT_EFG_PCT || 0;
                    const drivePts = currentTracking.DRIVE_PTS_PCT || 0;
                    const transitionPlay = currentStats.find(s => s.playType === 'Transition' && s.side === 'offensive');
                    const prHandlerPlay = currentStats.find(s => s.playType === 'PRBallHandler' && s.side === 'offensive');

                    data = [
                        { subject: '單打 (Isolation)', A: isoPlay ? isoPlay.percentile : 0, fullMark: 100 },
                        { subject: '切入得分 (Drive)', A: drivePts, fullMark: 100 },
                        { subject: '接球跳投 (C&S)', A: catchShootEfg, fullMark: 100 },
                        { subject: '轉換快攻 (Transition)', A: transitionPlay ? transitionPlay.percentile : 0, fullMark: 100 },
                        { subject: '擋拆持球 (P&R Hand)', A: prHandlerPlay ? prHandlerPlay.percentile : 0, fullMark: 100 },
                    ];
                } else {
                    const isoDef = currentStats.find(s => s.playType === 'Isolation' && s.side === 'defensive');
                    const spotUpDef = currentStats.find(s => s.playType === 'Spotup' && s.side === 'defensive');
                    const prDef = currentStats.find(s => s.playType === 'PRBallHandler' && s.side === 'defensive');
                    const rebContest = currentTracking.REB_CONTEST_PCT || 0;

                    data = [
                        { subject: '單打防禦 (Iso Def)', A: isoDef ? isoDef.percentile : 0, fullMark: 100 },
                        { subject: '定點防線 (Spotup Def)', A: spotUpDef ? spotUpDef.percentile : 0, fullMark: 100 },
                        { subject: '擋拆防守 (P&R Def)', A: prDef ? prDef.percentile : 0, fullMark: 100 },
                        { subject: '干擾籃板 (Contest Reb)', A: rebContest, fullMark: 100 }
                    ];
                }
                return data;
            };
            const radarData = generateRadarData();

            // Tracking Definitions
            const trackingDefs = [
                { id: 'Drives', title: '切入次數 (Drives)', metrics: [{ key: 'DRIVES', label: '切入次數' }, { key: 'DRIVE_FGM', label: '切入進球' }, { key: 'DRIVE_FG_PCT', label: '切入命中率', unit: '%' }, { key: 'DRIVE_TOV_PCT', label: '失誤率', unit: '%', betterIsLarger: false }] },
                { id: 'CatchShoot', title: '接球跳投 (C&S)', metrics: [{ key: 'CATCH_SHOOT_FGA', label: '出手次數' }, { key: 'CATCH_SHOOT_FG3_PCT', label: '三分命中率', unit: '%' }, { key: 'CATCH_SHOOT_EFG_PCT', label: '有效命中率(eFG%)', unit: '%' }] },
                { id: 'PullUpShot', title: '急停跳投 (Pull Up)', metrics: [{ key: 'PULL_UP_FGA', label: '急停出手數' }, { key: 'PULL_UP_FG3_PCT', label: '急停三分命中率', unit: '%' }, { key: 'PULL_UP_EFG_PCT', label: '有效命中率(eFG%)', unit: '%' }] },
                { id: 'Passing', title: '傳送與二傳 (Passing)', metrics: [{ key: 'PASSES_MADE', label: '傳送次數' }, { key: 'POTENTIAL_AST', label: '潛在助攻' }, { key: 'SECONDARY_AST', label: '二傳助攻(Secondary)' }, { key: 'AST_PTS_CREATED', label: '助攻創造得分' }] },
                { id: 'Touches', title: '觸球數 (Touches)', metrics: [{ key: 'TOUCHES', label: '觸球總數' }, { key: 'FRONT_CT_TOUCHES', label: '前場觸球' }, { key: 'TIME_OF_POSS', label: '持球時間(分)' }, { key: 'PTS_PER_TOUCH', label: '每次觸球得分(PPP)' }] },
                { id: 'Rebounding', title: '籃板掌握 (Rebounding)', metrics: [{ key: 'REB', label: '籃板數' }, { key: 'REB_CHANCES', label: '籃板機會' }, { key: 'REB_COL_PCT', label: '籃板掌握率', unit: '%' }, { key: 'REB_CONTEST_PCT', label: '防守干擾籃板率', unit: '%' }] },
            ];


            // History Modal Component
            const HistoryModal = ({ cardInfo, onClose }) => {
                const [chartMetric, setChartMetric] = useState(null);
                const [filterMode, setFilterMode] = useState('recent'); // 'recent' | 'range'
                const [recentCount, setRecentCount] = useState(10);
                const [dateStart, setDateStart] = useState('');
                const [dateEnd, setDateEnd] = useState('');

                const targetHistory = viewMode === 'TEAM' ? teamHistory : playerHistory;

                // Base extraction logic
                const baseStats = useMemo(() => {
                    return targetHistory.map(entry => {
                        let stat, trackingDat;
                        if (viewMode === 'TEAM') {
                            if (cardInfo.type === 'playtype') stat = entry.stats?.find(s => s.playType === cardInfo.id && s.side === viewSide);
                            else trackingDat = entry.tracking || {};
                        } else {
                            if (cardInfo.type === 'playtype') stat = entry.stats?.[selectedPlayer]?.find(s => s.playType === cardInfo.id && s.side === viewSide);
                            else trackingDat = entry.tracking?.[selectedPlayer] || {};
                        }
                        return { date: entry.date, stat, tracking: trackingDat };
                    }).filter(item => (cardInfo.type === 'playtype' ? item.stat : Object.keys(item.tracking || {}).length > 0));
                }, [targetHistory, viewMode, selectedPlayer, cardInfo, viewSide]);

                const displayedStats = useMemo(() => {
                    let filtered = [...baseStats];
                    if (filterMode === 'recent') {
                        if (recentCount !== 'ALL') filtered = filtered.slice(0, recentCount);
                    } else {
                        if (dateStart) filtered = filtered.filter(item => item.date >= dateStart);
                        if (dateEnd) filtered = filtered.filter(item => item.date <= dateEnd);
                    }
                    return filtered;
                }, [baseStats, filterMode, recentCount, dateStart, dateEnd]);

                const chartData = [...displayedStats].reverse();
                const toggleChart = (metric) => { if (chartMetric === metric) setChartMetric(null); else setChartMetric(metric); };

                // Identify modal title and columns based on type
                let title = "", cols = [];
                if (cardInfo.type === 'playtype') {
                    title = `${cardInfo.id} (${viewSide === 'offensive' ? '進攻' : '防守'})`;
                    cols = [{ k: 'ppp', l: 'PPP' }, { k: 'fgPct', l: 'FG%' }, { k: 'percentile', l: 'Percentile' }, { k: 'poss', l: 'Poss' }];
                } else {
                    const def = trackingDefs.find(t => t.id === cardInfo.id);
                    title = def?.title || cardInfo.id;
                    cols = def ? def.metrics.map(m => ({ k: m.key, l: m.label })) : [];
                }

                return (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                        <div className="bg-slate-950 rounded-2xl border border-slate-700 w-full max-w-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
                            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900 shrink-0">
                                <h3 className="text-lg font-bold text-white">
                                    {viewMode === 'PLAYER' ? selectedPlayer : '球隊'} - {title} 歷史數據
                                </h3>
                                <button onClick={onClose} className="text-slate-400 hover:text-white"><Icons.X /></button>
                            </div>

                            <div className="p-3 bg-slate-900 border-b border-slate-800 flex flex-wrap items-center gap-3">
                                <div className="flex bg-slate-800 rounded p-1">
                                    {[5, 10, 20, 'ALL'].map(count => (
                                        <button key={count} onClick={() => { setFilterMode('recent'); setRecentCount(count); setDateStart(''); setDateEnd(''); }} className={`px-3 py-1 text-xs rounded transition-colors ${filterMode === 'recent' && recentCount === count ? 'bg-[#78BE20] text-[#0C2340] font-bold shadow' : 'text-slate-400 hover:text-white'}`}>
                                            {count === 'ALL' ? '全部' : `近${count}場`}
                                        </button>
                                    ))}
                                </div>
                                <div className="h-6 w-px bg-slate-700 mx-1"></div>
                                <div className="flex items-center gap-2 text-xs">
                                    <input type="date" value={dateStart} onChange={(e) => { setDateStart(e.target.value); setFilterMode('range'); }} className="bg-slate-800 border border-slate-700 text-slate-300 px-2 py-1 rounded" />
                                    <span className="text-slate-500">to</span>
                                    <input type="date" value={dateEnd} onChange={(e) => { setDateEnd(e.target.value); setFilterMode('range'); }} className="bg-slate-800 border border-slate-700 text-slate-300 px-2 py-1 rounded" />
                                </div>
                            </div>

                            <div className="p-4 bg-slate-900/50 border-b border-slate-800">
                                <p className="text-xs text-slate-400 flex items-center gap-2 mb-2"><Icons.BarChart className="w-3 h-3" /> 點擊下方表格標題即可切換折線圖</p>
                                {chartMetric && (<div className="mb-4 fade-in"><SimpleLineChart data={chartData} dataKey={chartMetric} color="#78BE20" /></div>)}
                            </div>

                            <div className="p-0 overflow-y-auto">
                                <table className="w-full text-left text-sm text-slate-400">
                                    <thead className="bg-[#1e293b] text-xs font-bold text-slate-400 sticky top-0">
                                        <tr>
                                            <th className="px-6 py-3">日期</th>
                                            {cols.map(c => (
                                                <th key={c.k} className={`px-4 py-3 cursor-pointer hover:text-white transition-colors select-none ${chartMetric === c.k ? 'text-white border-b-2 border-[#78BE20]' : ''}`} onClick={() => toggleChart(c.k)}>
                                                    {c.l}
                                                </th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {displayedStats.map((item, idx) => {
                                            return (
                                                <tr key={item.date} className="hover:bg-slate-900/50 transition-colors">
                                                    <td className="px-6 py-4 font-mono text-slate-300">{item.date}</td>
                                                    {cols.map(c => {
                                                        const val = cardInfo.type === 'playtype' ? item.stat?.[c.k] : item.tracking?.[c.k];
                                                        return <td key={c.k} className="px-4 py-4 font-mono">{val ?? '-'}</td>
                                                    })}
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 font-sans pb-20">
                    {/* Header */}
                    <header className="sticky top-0 z-20 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 shadow-md">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 rounded-full bg-[#0C2340] border-2 border-[#78BE20] flex items-center justify-center overflow-hidden shadow-lg"><img src="https://i.imgur.com/HSY3cX7.png" alt="Timberwolves Logo" className="w-full h-full object-cover" /></div>
                                <div><h1 className="text-xl font-bold text-white tracking-tight">Wolves PlayType & Tracking</h1><p className="text-xs text-[#78BE20] font-medium tracking-wide cursor-pointer hover:underline" onClick={handleStatusClick}>DAILY TRACKER {isCloud ? <span className="text-blue-400 ml-2 animate-pulse">• Cloud Live</span> : <span className="text-red-500 ml-2">• No Conn</span>}</p></div>
                            </div>
                            <div className="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800">
                                <button onClick={goPrev} disabled={viewIndex >= maxIndex} className="p-2 rounded hover:bg-slate-800 text-slate-400 disabled:opacity-30"><Icons.ChevronLeft className="w-5 h-5" /></button>
                                <div className="px-4 font-mono font-bold text-[#78BE20]">{displayDate}</div>
                                <button onClick={goNext} disabled={viewIndex === 0} className="p-2 rounded hover:bg-slate-800 text-slate-400 disabled:opacity-30"><Icons.ChevronRight className="w-5 h-5" /></button>
                            </div>
                        </div>
                    </header>

                    {/* Main Layout */}
                    <main className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
                        <div className="grid md:grid-cols-4 gap-6">
                            {/* Left Sidebar: Selectors & Radar Array */}
                            <div className="md:col-span-1 space-y-6">
                                <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-800 space-y-4 shadow-lg">
                                    <div className="flex gap-2 bg-slate-950 p-1 rounded border border-slate-800">
                                        <button onClick={() => { setViewMode('TEAM'); setViewIndex(0); }} className={`flex-1 py-2 text-sm font-bold rounded flex items-center justify-center gap-2 ${viewMode === 'TEAM' ? 'bg-[#236192] text-white shadow' : 'text-slate-400'}`}><Icons.Users className="w-4 h-4" /> 球隊</button>
                                        <button onClick={() => { setViewMode('PLAYER'); setViewIndex(0); }} className={`flex-1 py-2 text-sm font-bold rounded flex items-center justify-center gap-2 ${viewMode === 'PLAYER' ? 'bg-[#236192] text-white shadow' : 'text-slate-400'}`}><Icons.User className="w-4 h-4" /> 球員</button>
                                    </div>
                                    <div className="flex gap-2 bg-slate-950 p-1 rounded border border-slate-800">
                                        <button onClick={() => setViewSide('offensive')} className={`flex-1 py-2 text-sm font-bold rounded flex items-center justify-center gap-2 ${viewSide === 'offensive' ? 'bg-[#78BE20] text-[#0C2340] shadow' : 'text-slate-400'}`}><Icons.Sword className="w-4 h-4" /> 進攻</button>
                                        <button onClick={() => setViewSide('defensive')} className={`flex-1 py-2 text-sm font-bold rounded flex items-center justify-center gap-2 ${viewSide === 'defensive' ? 'bg-red-700 text-white shadow' : 'text-slate-400'}`}><Icons.Shield className="w-4 h-4" /> 防守</button>
                                    </div>
                                    {viewMode === 'PLAYER' && (
                                        <div className="max-h-[300px] overflow-y-auto pr-2 rounded mt-2 border border-slate-800/50 p-2">
                                            {availablePlayers.length === 0 && <p className="text-slate-500 text-xs p-2">當日無球員數據</p>}
                                            {availablePlayers.map(player => {
                                                const pStats = (playerHistory[viewIndex]?.stats?.[player]) || [];
                                                const pTrack = (playerHistory[viewIndex]?.tracking?.[player]) || {};
                                                const pId = pStats[0]?.playerId || pTrack.playerId || "0";
                                                
                                                return (
                                                    <button key={player} onClick={() => { setSelectedPlayer(player); setViewIndex(0); }} className={`w-full text-left px-3 py-2 my-1 rounded text-sm transition-colors flex items-center gap-2 ${selectedPlayer === player ? 'bg-[#78BE20]/20 border border-[#78BE20]/50 text-[#78BE20] font-bold' : 'text-slate-400 hover:bg-slate-800'}`}>
                                                        <img src={`https://cdn.nba.com/headshots/nba/latest/260x190/${pId}.png`} onError={(e) => { e.target.style.display = 'none'; }} className="h-6 w-6 rounded-full bg-slate-800 object-cover" alt="" />
                                                        {player}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>

                                {/* Radar Chart Card */}
                                {(viewMode === 'PLAYER' && currentStats?.length > 0) && (
                                    <div className="bg-slate-900/50 p-2 rounded-xl border border-slate-800 flex flex-col items-center">
                                        <h3 className="text-slate-300 text-sm font-bold mt-2 mb-1">{viewSide === 'offensive' ? '進攻雷達網 (Percentile)' : '防守雷達網 (Percentile)'}</h3>
                                        {RadarChart && ResponsiveContainer ? (
                                            <div className="w-full h-[250px]">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <RadarChart cx="50%" cy="50%" outerRadius="60%" data={radarData}>
                                                        <PolarGrid stroke="#334155" />
                                                        <PolarAngleAxis dataKey="subject" tick={{ fill: '#94a3b8', fontSize: 10 }} />
                                                        <PolarRadiusAxis angle={30} domain={[0, 100]} tick={false} axisLine={false} />
                                                        <Radar name={selectedPlayer} dataKey="A" stroke={viewSide === 'offensive' ? '#78BE20' : '#ef4444'} fill={viewSide === 'offensive' ? '#78BE20' : '#ef4444'} fillOpacity={0.4} />
                                                        <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155' }} itemStyle={{ color: 'white', fontWeight: 'bold' }} />
                                                    </RadarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        ) : (
                                            <div className="w-full h-[250px] flex items-center justify-center text-slate-500 text-xs border border-slate-800 border-dashed rounded mt-2">雷達圖模組載入中或失敗...</div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Right Content: Cards */}
                            <div className="md:col-span-3 space-y-6">
                                <div className="border border-slate-800 rounded-xl p-6 relative overflow-hidden bg-slate-900 border-l-4 border-l-[#78BE20]">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-bold border-b-2 border-slate-700 pb-2 flex-grow">
                                            {viewMode === 'PLAYER' ? selectedPlayer : '團隊'} - Synergy PlayType ({viewSide === 'offensive' ? '進攻' : '防守'})
                                        </h2>
                                    </div>
                                    <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                        {PlayTypesList.map(type => {
                                            const stat = currentStats.find(s => s.playType === type && (s.side || 'offensive') === viewSide);
                                            const prevStat = prevStats ? prevStats.find(s => s.playType === type && (s.side || 'offensive') === viewSide) : null;
                                            return <PlayTypeCard key={type} type={type} current={stat} prev={prevStat} onClick={setSelectedCard} side={viewSide} />;
                                        })}
                                    </div>
                                </div>

                                {/* Tracking Data Layout (Rows of Cards) */}
                                {viewSide === 'offensive' && (
                                    <div className="border border-slate-800 rounded-xl p-6 relative overflow-hidden bg-slate-900 border-l-4 border-l-[#236192]">
                                        <h2 className="text-xl font-bold border-b-2 border-slate-700 pb-2 mb-6">進階數據 (Tracking)</h2>
                                        {trackingDefs.map(def => (
                                            <TrackingCardRow
                                                key={def.id} title={def.title} category={def.id}
                                                metrics={def.metrics} current={currentTracking} prev={prevTracking}
                                                onClick={setSelectedCard}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {selectedCard && <HistoryModal cardInfo={selectedCard} onClose={() => setSelectedCard(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
