name: Daily NBA Data Fetch

on:
  schedule:
    # 每天 UTC 10:00 (台灣時間 18:00，美國東部凌晨 05:00) 執行抓取確保當天比賽結束且已結算
    - cron: '0 10 * * *'
  workflow_dispatch: # 允許手動觸發測試

jobs:
  fetch_and_update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # 啟用 pip 快取加速執行

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Python Scraper (Fetch Data & Write to Firebase)
      env:
        # 將 Firebase 憑證放在 GitHub Secrets 裡
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        # 加上 -u 參數強制 Python 不做輸出緩衝
        python -u scripts/fetch_data.py
